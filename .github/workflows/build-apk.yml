name: Build Release AAB and APK
on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Repair Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Inject Website Data & Versioning
        run: |
          # 1. Update URL & App Name
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ github.event.client_payload.name }}</string>|g" app/src/main/res/values/strings.xml
          find app/src/main/java -name "MainActivity.kt" -exec sed -i "s|PLACEHOLDER_URL|${{ github.event.client_payload.url }}|g" {} +
          
          # 2. Update Package ID, Version Code, and Version Name in build.gradle.kts
          sed -i "s|namespace = \".*\"|namespace = \"${{ github.event.client_payload.package_id }}\"|g" app/build.gradle.kts
          sed -i "s|applicationId = \".*\"|applicationId = \"${{ github.event.client_payload.package_id }}\"|g" app/build.gradle.kts
          sed -i "s|versionCode = .*|versionCode = ${{ github.event.client_payload.version_code }}|g" app/build.gradle.kts
          sed -i "s|versionName = \".*\"|versionName = \"${{ github.event.client_payload.version_name }}\"|g" app/build.gradle.kts

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release-key.jks

      - name: Build and Sign
        run: |
          ./gradlew bundleRelease assembleDebug \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.name }}-v${{ github.event.client_payload.version_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
