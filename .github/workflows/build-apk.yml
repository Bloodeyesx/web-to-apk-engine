name: Automated Release Factory
on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Repair Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: DYNAMIC INJECTION (The Secret Sauce)
        env:
          PAYLOAD_NAME: ${{ github.event.client_payload.general.name }}
          PAYLOAD_PACKAGE: ${{ github.event.client_payload.general.package_id }}
          PAYLOAD_URL: ${{ github.event.client_payload.general.url }}
          PAYLOAD_ZIP: ${{ github.event.client_payload.general.dist_zip_content }}
          PAYLOAD_V_CODE: ${{ github.event.client_payload.general.version_code }}
          PAYLOAD_V_NAME: ${{ github.event.client_payload.general.version_name }}
          PAYLOAD_COLOR: ${{ github.event.client_payload.design.theme_color }}
          PAYLOAD_MAPPING: ${{ github.event.client_payload.settings.generate_retrace_mapping }}
          PAYLOAD_DOWNLOADS: ${{ github.event.client_payload.settings.allow_downloads }}
          PAYLOAD_ICON: ${{ github.event.client_payload.design.icon_url }}
          PAYLOAD_NAV: ${{ github.event.client_payload.design.navigation_mode }}
          PAYLOAD_ORIENT: ${{ github.event.client_payload.design.screen_orientation }}
          PAYLOAD_AD_ID: ${{ github.event.client_payload.settings.include_ad_id_permission }}
          
          # Permission Flags
          PAYLOAD_PERM_CAMERA: ${{ github.event.client_payload.settings.permissions.camera }}
          PAYLOAD_PERM_MIC: ${{ github.event.client_payload.settings.permissions.microphone }}
          PAYLOAD_PERM_LOC: ${{ github.event.client_payload.settings.permissions.location }}
        run: |
          # Helper to safely resolve variables with defaults
          resolve_var() {
            local val=$(echo "$1" | xargs) # Trim whitespace
            local default="$2"
            if [ -z "$val" ] || [ "$val" == "null" ]; then
              echo "$default"
            else
              echo "$val"
            fi
          }

          # Resolve variables
          APP_NAME=$(resolve_var "$PAYLOAD_NAME" "WebApp")
          PACKAGE_ID=$(resolve_var "$PAYLOAD_PACKAGE" "com.example.webapp")
          VERSION_CODE=$(resolve_var "$PAYLOAD_V_CODE" "1")
          VERSION_NAME=$(resolve_var "$PAYLOAD_V_NAME" "1.0.0")
          THEME_COLOR=$(resolve_var "$PAYLOAD_COLOR" "#000000")
          GEN_MAPPING=$(resolve_var "$PAYLOAD_MAPPING" "false")
          ALLOW_DOWNLOADS=$(resolve_var "$PAYLOAD_DOWNLOADS" "false")
          
          # Extra vars for config persistence
          ICON_URL=$(resolve_var "$PAYLOAD_ICON" "")
          NAV_MODE=$(resolve_var "$PAYLOAD_NAV" "bar")
          ORIENTATION=$(resolve_var "$PAYLOAD_ORIENT" "system")
          INCLUDE_AD_ID=$(resolve_var "$PAYLOAD_AD_ID" "true")
          
          # Permission vars
          PERM_CAMERA=$(resolve_var "$PAYLOAD_PERM_CAMERA" "false")
          PERM_MIC=$(resolve_var "$PAYLOAD_PERM_MIC" "false")
          PERM_LOC=$(resolve_var "$PAYLOAD_PERM_LOC" "false")

          # Handle Source (URL or ZIP)
          if [ ! -z "$PAYLOAD_ZIP" ] && [ "$PAYLOAD_ZIP" != "null" ]; then
             echo "Detected Embedded Zip Payload. Processing..."
             
             # Decode Base64 to zip file
             echo "$PAYLOAD_ZIP" | base64 --decode > temp_dist.zip
             
             # Create assets directory
             mkdir -p app/src/main/assets/www
             
             # Unzip into assets/www
             unzip temp_dist.zip -d app/src/main/assets/www
             
             # Set URL to local file path
             URL="file:///android_asset/www/index.html"
             INPUT_MODE="zip"
             TARGET_URL=""
             echo "Source Mode: Local Zip (index.html)"
             
             # Clean up
             rm temp_dist.zip
          else
             URL=$(resolve_var "$PAYLOAD_URL" "https://example.com")
             INPUT_MODE="url"
             TARGET_URL="$URL"
             echo "Source Mode: Remote URL"
          fi

          echo "----------------------------------------"
          echo "Build Configuration:"
          echo "Name: $APP_NAME"
          echo "Package: $PACKAGE_ID"
          echo "URL: $URL"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "Color: $THEME_COLOR"
          echo "Permissions: Cam=$PERM_CAMERA, Mic=$PERM_MIC, Loc=$PERM_LOC"
          echo "Downloads: $ALLOW_DOWNLOADS"
          echo "----------------------------------------"

          # Export for next steps
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

          # Generate config for restoration
          cat <<EOF > build_config.json
          {
            "appName": "$APP_NAME",
            "packageId": "$PACKAGE_ID",
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "targetSdk": 35,
            "url": "$TARGET_URL",
            "inputMode": "$INPUT_MODE",
            "iconUrl": "$ICON_URL",
            "themeColor": "$THEME_COLOR",
            "navMode": "$NAV_MODE",
            "orientation": "$ORIENTATION",
            "includeAdId": $INCLUDE_AD_ID,
            "generateReTraceMapping": $GEN_MAPPING,
            "allowDownloads": $ALLOW_DOWNLOADS,
            "permissions": {
                "camera": $PERM_CAMERA,
                "microphone": $PERM_MIC,
                "location": $PERM_LOC
            }
          }
          EOF

          # 1. Update App Name
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml
          
          # 2. Find and Sync MainActivity.kt
          KOTLIN_PATH=$(find app/src/main/java -name "MainActivity.kt")
          if [ -f "$KOTLIN_PATH" ]; then
              sed -i "s|package .*|package $PACKAGE_ID|g" $KOTLIN_PATH
              # Update URL Placeholder
              sed -i "s|PLACEHOLDER_URL|$URL|g" $KOTLIN_PATH
          else
              echo "Warning: MainActivity.kt not found"
          fi

          # 3. Update build.gradle.kts
          GRADLE_FILE="app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
              sed -i "s|namespace\s*=\s*\".*\"|namespace = \"$PACKAGE_ID\"|g" $GRADLE_FILE
              sed -i "s|applicationId\s*=\s*\".*\"|applicationId = \"$PACKAGE_ID\"|g" $GRADLE_FILE
              sed -i "s|versionCode\s*=\s*[0-9]*|versionCode = $VERSION_CODE|g" $GRADLE_FILE
              sed -i "s|versionName\s*=\s*\".*\"|versionName = \"$VERSION_NAME\"|g" $GRADLE_FILE
              sed -i "s|compileSdk\s*=\s*[0-9]*|compileSdk = 35|g" $GRADLE_FILE
              sed -i "s|targetSdk\s*=\s*[0-9]*|targetSdk = 35|g" $GRADLE_FILE
              
              if [ "$GEN_MAPPING" == "true" ]; then
                 echo "Enabling R8 Minification..."
                 sed -i "s|isMinifyEnabled\s*=\s*false|isMinifyEnabled = true|g" $GRADLE_FILE
                 sed -i "s|isShrinkResources\s*=\s*false|isShrinkResources = true|g" $GRADLE_FILE
              fi
          else
              echo "Error: build.gradle.kts not found!"
              exit 1
          fi

          # 4. Inject Theme Color
          COLORS_FILE="app/src/main/res/values/colors.xml"
          if [ -f "$COLORS_FILE" ] && [ ! -z "$THEME_COLOR" ]; then
             sed -i "s|<color name=\"colorPrimary\">.*</color>|<color name=\"colorPrimary\">$THEME_COLOR</color>|g" $COLORS_FILE || true
             sed -i "s|<color name=\"colorPrimaryDark\">.*</color>|<color name=\"colorPrimaryDark\">$THEME_COLOR</color>|g" $COLORS_FILE || true
          fi

          # 5. Inject Permissions & Download Support
          MANIFEST=$(find app/src/main -name "AndroidManifest.xml")
          if [ -f "$MANIFEST" ]; then
              echo "Injecting Permissions..."
              
              # Function to inject permission if missing
              # Uses Perl for safe multiline replacement to avoid XML corruption
              inject_perm() {
                  local PERM=$1
                  if ! grep -q "$PERM" "$MANIFEST"; then
                       # Insert before <application tag
                       perl -i -pe 's|<application|<uses-permission android:name="android.permission.'$PERM'" />\n    <application|' $MANIFEST
                  fi
              }
              
              # Always ensure Internet
              inject_perm "INTERNET"

              if [ "$ALLOW_DOWNLOADS" == "true" ]; then
                 inject_perm "WRITE_EXTERNAL_STORAGE"
                 inject_perm "READ_EXTERNAL_STORAGE"
                 inject_perm "POST_NOTIFICATIONS"
                 # Enable legacy storage request AND cleartext traffic for http downloads
                 perl -i -pe 's|<application|<application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"|' $MANIFEST
              else
                 # Just enable cleartext traffic for standard webview usage
                 perl -i -pe 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
              fi
              
              if [ "$PERM_CAMERA" == "true" ]; then inject_perm "CAMERA"; fi
              if [ "$PERM_MIC" == "true" ]; then inject_perm "RECORD_AUDIO"; fi
              if [ "$PERM_LOC" == "true" ]; then 
                  inject_perm "ACCESS_FINE_LOCATION"
                  inject_perm "ACCESS_COARSE_LOCATION"
              fi
          fi
          
          # 6. Inject Download Listener into Kotlin
          if [ "$ALLOW_DOWNLOADS" == "true" ] && [ -f "$KOTLIN_PATH" ]; then
             echo "Injecting Download Listener Code..."
             
             # Detect variable name for WebView by looking for loadUrl
             LINE_NUM=$(grep -n "loadUrl" $KOTLIN_PATH | cut -d: -f1 | head -n 1)
             LINE_CONTENT=$(sed "${LINE_NUM}q;d" $KOTLIN_PATH)
             WEBVIEW_VAR=$(echo $LINE_CONTENT | awk -F. '{print $1}' | xargs)
             
             if [ ! -z "$WEBVIEW_VAR" ]; then
                 # Create code block using printf to avoid heredoc indentation issues.
                 # Includes Try-Catch to prevent crashes on unsupported URLs (e.g. blob:)
                 # Falls back to external Intent for non-HTTP schemes.
                 printf "\n        // Download Support Injected\n        %s.setDownloadListener { url, userAgent, contentDisposition, mimetype, contentLength ->\n             if (url.startsWith(\"http\") || url.startsWith(\"https\")) {\n                 try {\n                     val request = android.app.DownloadManager.Request(android.net.Uri.parse(url))\n                     request.setMimeType(mimetype)\n                     request.addRequestHeader(\"cookie\", android.webkit.CookieManager.getInstance().getCookie(url))\n                     request.addRequestHeader(\"User-Agent\", userAgent)\n                     request.setDescription(\"Downloading file...\")\n                     request.setTitle(android.webkit.URLUtil.guessFileName(url, contentDisposition, mimetype))\n                     request.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)\n                     request.setDestinationInExternalPublicDir(android.os.Environment.DIRECTORY_DOWNLOADS, android.webkit.URLUtil.guessFileName(url, contentDisposition, mimetype))\n                     val dm = getSystemService(android.content.Context.DOWNLOAD_SERVICE) as android.app.DownloadManager\n                     dm.enqueue(request)\n                     android.widget.Toast.makeText(applicationContext, \"Downloading...\", android.widget.Toast.LENGTH_SHORT).show()\n                 } catch (e: Exception) {\n                     android.widget.Toast.makeText(applicationContext, \"Download Error: \" + e.message, android.widget.Toast.LENGTH_LONG).show()\n                 }\n             } else {\n                 try {\n                     val intent = android.content.Intent(android.content.Intent.ACTION_VIEW)\n                     intent.setData(android.net.Uri.parse(url))\n                     startActivity(intent)\n                 } catch (e: Exception) {\n                     android.widget.Toast.makeText(applicationContext, \"Cannot open file type\", android.widget.Toast.LENGTH_SHORT).show()\n                 }\n             }\n        }\n" "$WEBVIEW_VAR" > download_logic.kt

                 # Insert MARKER before loadUrl
                 sed -i "${LINE_NUM}i MARKER_DL" $KOTLIN_PATH
                 
                 # Replace MARKER_DL with file content
                 # Use perl for reliable multiline replacement
                 perl -i -pe 'BEGIN{local $/; open(F,"download_logic.kt"); $c=<F>;} s/MARKER_DL/$c/' $KOTLIN_PATH
             fi
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $GITHUB_WORKSPACE/release-key.jks

      - name: Build Signed AAB and APK
        run: |
          ./gradlew bundleRelease assembleDebug \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME || 'App' }}-v${{ env.VERSION_NAME || '1.0' }}
          if-no-files-found: warn
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/mapping/release/mapping.txt
            
      - name: Upload Build Metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: build_config.json
