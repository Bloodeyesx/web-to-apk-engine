name: Automated Release Factory
on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Repair Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: DYNAMIC INJECTION (The Secret Sauce)
        run: |
          # 1. Update App Name
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ github.event.client_payload.name }}</string>|g" app/src/main/res/values/strings.xml
          
          # 2. Find and Sync MainActivity.kt
          # This finds the file no matter what folder it's in and updates the package and URL
          KOTLIN_PATH=$(find app/src/main/java -name "MainActivity.kt")
          sed -i "s|package .*|package ${{ github.event.client_payload.package_id }}|g" $KOTLIN_PATH
          sed -i "s|PLACEHOLDER_URL|${{ github.event.client_payload.url }}|g" $KOTLIN_PATH

          # 3. Update build.gradle.kts (Target API 35 + Dynamic Package ID)
          sed -i "s|namespace = \".*\"|namespace = \"${{ github.event.client_payload.package_id }}\"|g" app/build.gradle.kts
          sed -i "s|applicationId = \".*\"|applicationId = \"${{ github.event.client_payload.package_id }}\"|g" app/build.gradle.kts
          sed -i "s|versionCode = .*|versionCode = ${{ github.event.client_payload.version_code }}|g" app/build.gradle.kts
          sed -i "s|versionName = \".*\"|versionName = \"${{ github.event.client_payload.version_name }}\"|g" app/build.gradle.kts
          sed -i "s|compileSdk = .*|compileSdk = 35|g" app/build.gradle.kts
          sed -i "s|targetSdk = .*|targetSdk = 35|g" app/build.gradle.kts

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $GITHUB_WORKSPACE/release-key.jks

      - name: Build Signed AAB and APK
        run: |
          ./gradlew bundleRelease assembleDebug \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.name }}-v${{ github.event.client_payload.version_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
