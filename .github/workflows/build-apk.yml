name: Automated Release Factory
on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Repair Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: DYNAMIC INJECTION (The Secret Sauce)
        env:
          PAYLOAD_NAME: ${{ github.event.client_payload.general.name }}
          PAYLOAD_PACKAGE: ${{ github.event.client_payload.general.package_id }}
          PAYLOAD_URL: ${{ github.event.client_payload.general.url }}
          PAYLOAD_ZIP: ${{ github.event.client_payload.general.dist_zip_content }}
          PAYLOAD_V_CODE: ${{ github.event.client_payload.general.version_code }}
          PAYLOAD_V_NAME: ${{ github.event.client_payload.general.version_name }}
          PAYLOAD_COLOR: ${{ github.event.client_payload.design.theme_color }}
          PAYLOAD_MAPPING: ${{ github.event.client_payload.settings.generate_retrace_mapping }}
          PAYLOAD_DOWNLOADS: ${{ github.event.client_payload.settings.allow_downloads }}
          PAYLOAD_TARGET_SDK: ${{ github.event.client_payload.settings.target_sdk_version }}
          
          # Permission Flags
          PAYLOAD_PERM_CAMERA: ${{ github.event.client_payload.settings.permissions.camera }}
          PAYLOAD_PERM_MIC: ${{ github.event.client_payload.settings.permissions.microphone }}
          PAYLOAD_PERM_LOC: ${{ github.event.client_payload.settings.permissions.location }}
        run: |
          # 1. SETUP & VARIABLE RESOLUTION
          resolve_var() {
            local val=$(echo "$1" | xargs)
            local default="$2"
            if [ -z "$val" ] || [ "$val" == "null" ]; then echo "$default"; else echo "$val"; fi
          }

          APP_NAME=$(resolve_var "$PAYLOAD_NAME" "WebApp")
          PACKAGE_ID=$(resolve_var "$PAYLOAD_PACKAGE" "com.example.webapp")
          VERSION_CODE=$(resolve_var "$PAYLOAD_V_CODE" "1")
          VERSION_NAME=$(resolve_var "$PAYLOAD_V_NAME" "1.0.0")
          THEME_COLOR=$(resolve_var "$PAYLOAD_COLOR" "#000000")
          GEN_MAPPING=$(resolve_var "$PAYLOAD_MAPPING" "false")
          TARGET_SDK=$(resolve_var "$PAYLOAD_TARGET_SDK" "35")
          
          # Export for Python scripts
          export ALLOW_DOWNLOADS=$(resolve_var "$PAYLOAD_DOWNLOADS" "false")
          export PERM_CAMERA=$(resolve_var "$PAYLOAD_PERM_CAMERA" "false")
          export PERM_MIC=$(resolve_var "$PAYLOAD_PERM_MIC" "false")
          export PERM_LOC=$(resolve_var "$PAYLOAD_PERM_LOC" "false")

          # Handle Source
          if [ ! -z "$PAYLOAD_ZIP" ] && [ "$PAYLOAD_ZIP" != "null" ]; then
             echo "Detected Embedded Zip Payload. Processing..."
             echo "$PAYLOAD_ZIP" | base64 --decode > temp_dist.zip
             mkdir -p app/src/main/assets/www
             unzip -o temp_dist.zip -d app/src/main/assets/www
             URL="file:///android_asset/www/index.html"
             rm temp_dist.zip
          else
             URL=$(resolve_var "$PAYLOAD_URL" "https://example.com")
          fi

          # 2. INJECT STRINGS & PACKAGE
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml
          
          KOTLIN_PATH=$(find app/src/main/java -name "MainActivity.kt")
          export KOTLIN_PATH
          
          if [ -f "$KOTLIN_PATH" ]; then
              sed -i "s|package .*|package $PACKAGE_ID|g" $KOTLIN_PATH
              sed -i "s|PLACEHOLDER_URL|$URL|g" $KOTLIN_PATH
          fi

          # 3. BUILD GRADLE CONFIG
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          GRADLE_FILE="app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
              sed -i "s|namespace\s*=\s*\".*\"|namespace = \"$PACKAGE_ID\"|g" $GRADLE_FILE
              sed -i "s|applicationId\s*=\s*\".*\"|applicationId = \"$PACKAGE_ID\"|g" $GRADLE_FILE
              sed -i "s|versionCode\s*=\s*[0-9]*|versionCode = $VERSION_CODE|g" $GRADLE_FILE
              sed -i "s|versionName\s*=\s*\".*\"|versionName = \"$VERSION_NAME\"|g" $GRADLE_FILE
              sed -i -E "s|compileSdk.*|compileSdk = $TARGET_SDK|g" $GRADLE_FILE
              sed -i -E "s|targetSdk.*|targetSdk = $TARGET_SDK|g" $GRADLE_FILE
              
              if [ "$GEN_MAPPING" == "true" ]; then
                 sed -i "s|isMinifyEnabled\s*=\s*false|isMinifyEnabled = true|g" $GRADLE_FILE
                 sed -i "s|isShrinkResources\s*=\s*false|isShrinkResources = true|g" $GRADLE_FILE
              fi
          fi

          # 4. PYTHON MANIFEST INJECTION
          cat <<'EOF' > update_manifest.py
          import os
          import sys
          import re

          manifest_path = 'app/src/main/AndroidManifest.xml'
          allow_downloads = os.environ.get('ALLOW_DOWNLOADS') == 'true'
          perm_camera = os.environ.get('PERM_CAMERA') == 'true'
          perm_mic = os.environ.get('PERM_MIC') == 'true'
          perm_loc = os.environ.get('PERM_LOC') == 'true'

          try:
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              new_perms = []
              # Base Permissions
              if 'android.permission.INTERNET' not in content:
                  new_perms.append('    <uses-permission android:name="android.permission.INTERNET" />')
              
              if allow_downloads: 
                  # For older Android versions mostly
                  if 'android.permission.WRITE_EXTERNAL_STORAGE' not in content:
                      new_perms.append('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />')
                  if 'android.permission.READ_EXTERNAL_STORAGE' not in content:
                      new_perms.append('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />')

              if perm_camera and 'android.permission.CAMERA' not in content:
                  new_perms.append('    <uses-permission android:name="android.permission.CAMERA" />')
              
              if perm_mic and 'android.permission.RECORD_AUDIO' not in content:
                  new_perms.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />')
                  
              if perm_loc and 'android.permission.ACCESS_FINE_LOCATION' not in content:
                  new_perms.append('    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />')
                  new_perms.append('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />')

              def update_app_tag(match):
                  tag = match.group(0)
                  if 'android:usesCleartextTraffic' not in tag:
                      tag = tag.replace('<application', '<application android:usesCleartextTraffic="true"')
                  if allow_downloads and 'android:requestLegacyExternalStorage' not in tag:
                      tag = tag.replace('<application', '<application android:requestLegacyExternalStorage="true"')
                  return tag

              content = re.sub(r'<application[^>]*>', update_app_tag, content, count=1)
              
              if len(new_perms) > 0:
                  perm_string = '\n'.join(new_perms)
                  content = content.replace('<application', perm_string + '\n    <application')

              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
                  
          except Exception as e:
              print(e)
              sys.exit(1)
          EOF
          
          python3 update_manifest.py
          
          # 5. KOTLIN DOWNLOAD LISTENER INJECTION
          if [ "$ALLOW_DOWNLOADS" == "true" ] && [ -f "$KOTLIN_PATH" ]; then
             # Improved regex to capture 'binding.webView.loadUrl' correctly
             WEBVIEW_VAR=$(grep -o "[^ ]*\.loadUrl" $KOTLIN_PATH | head -n 1 | sed 's/\.loadUrl//')
             # Fallback if variable is empty (e.g. if loadUrl is called differently)
             if [ -z "$WEBVIEW_VAR" ]; then
                WEBVIEW_VAR=$(grep "loadUrl" $KOTLIN_PATH | head -n 1 | awk -F. '{print $1}' | xargs)
             fi
             export WEBVIEW_VAR
             
             if [ ! -z "$WEBVIEW_VAR" ]; then
                 cat <<'EOF' > inject_download.py
          import os

          kotlin_path = os.environ['KOTLIN_PATH']
          webview_var = os.environ['WEBVIEW_VAR']

          code = f"""
                  // Advanced Download & Blob Support (MediaStore)
                  class BlobHandler(private val context: android.content.Context) {{
                      @android.webkit.JavascriptInterface
                      fun handleBlob(base64Data: String, mimetype: String) {{
                          try {{
                              val decodedBytes = android.util.Base64.decode(base64Data, android.util.Base64.DEFAULT)
                              val ext = if (mimetype.contains("/")) mimetype.split("/")[1] else "bin"
                              val timestamp = System.currentTimeMillis()
                              val fileName = "download_$timestamp.$ext"
                              
                              if (android.os.Build.VERSION.SDK_INT >= 29) {{
                                  val contentValues = android.content.ContentValues().apply {{
                                      put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                                      put(android.provider.MediaStore.MediaColumns.MIME_TYPE, mimetype)
                                      put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS)
                                  }}
                                  val uri = context.contentResolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, contentValues)
                                  if (uri != null) {{
                                      context.contentResolver.openOutputStream(uri)?.use {{ it.write(decodedBytes) }}
                                      (context as? android.app.Activity)?.runOnUiThread {{
                                          android.widget.Toast.makeText(context, "Saved to Downloads", android.widget.Toast.LENGTH_LONG).show()
                                      }}
                                  }} else {{
                                      throw Exception("Failed to create MediaStore entry")
                                  }}
                              }} else {{
                                  // Legacy Storage
                                  val path = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS)
                                  val file = java.io.File(path, fileName)
                                  java.io.FileOutputStream(file).use {{ it.write(decodedBytes) }}
                                  android.media.MediaScannerConnection.scanFile(context, arrayOf(file.absolutePath), null, null)
                                  (context as? android.app.Activity)?.runOnUiThread {{
                                      android.widget.Toast.makeText(context, "Saved to Downloads", android.widget.Toast.LENGTH_LONG).show()
                                  }}
                              }}
                          }} catch (e: Exception) {{
                               (context as? android.app.Activity)?.runOnUiThread {{
                                  android.widget.Toast.makeText(context, "Download Error: " + e.message, android.widget.Toast.LENGTH_SHORT).show()
                              }}
                          }}
                      }}
                  }}

                  {webview_var}.addJavascriptInterface(BlobHandler(this), "BlobHandler")
                  {webview_var}.settings.javaScriptEnabled = true

                  {webview_var}.setDownloadListener {{ url, userAgent, contentDisposition, mimetype, contentLength ->
                      try {{
                          if (url.startsWith("http://") || url.startsWith("https://")) {{
                              val request = android.app.DownloadManager.Request(android.net.Uri.parse(url))
                              val fileName = android.webkit.URLUtil.guessFileName(url, contentDisposition, mimetype)
                              request.setMimeType(mimetype)
                              request.addRequestHeader("cookie", android.webkit.CookieManager.getInstance().getCookie(url))
                              request.addRequestHeader("User-Agent", userAgent)
                              request.setTitle(fileName)
                              request.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              request.setDestinationInExternalPublicDir(android.os.Environment.DIRECTORY_DOWNLOADS, fileName)
                              (getSystemService(DOWNLOAD_SERVICE) as android.app.DownloadManager).enqueue(request)
                              android.widget.Toast.makeText(applicationContext, "Downloading...", android.widget.Toast.LENGTH_SHORT).show()
                          }} else if (url.startsWith("data:")) {{
                              val base64Data = url.substring(url.indexOf(",") + 1)
                              BlobHandler(this).handleBlob(base64Data, mimetype)
                          }} else if (url.startsWith("blob:")) {{
                              val js = "var xhr = new XMLHttpRequest(); " +
                                       "xhr.open('GET', '" + url + "', true); " +
                                       "xhr.responseType = 'blob'; " +
                                       "xhr.onload = function(e) {{ " +
                                       "  if (this.status == 200) {{ " +
                                       "    var blob = this.response; " +
                                       "    var reader = new FileReader(); " +
                                       "    reader.readAsDataURL(blob); " +
                                       "    reader.onloadend = function() {{ " +
                                       "      var base64data = reader.result.split(',')[1]; " +
                                       "      BlobHandler.handleBlob(base64data, blob.type); " +
                                       "    }} " +
                                       "  }} " +
                                       "}}; " +
                                       "xhr.send();"
                              {webview_var}.evaluateJavascript(js, null)
                              android.widget.Toast.makeText(applicationContext, "Processing blob...", android.widget.Toast.LENGTH_SHORT).show()
                          }} else {{
                              val intent = android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(url))
                              startActivity(intent)
                          }}
                      }} catch (e: Exception) {{
                          android.widget.Toast.makeText(applicationContext, "Link error: " + e.message, android.widget.Toast.LENGTH_SHORT).show()
                      }}
                  }}
          """

          try:
              with open(kotlin_path, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              
              inject_idx = -1
              for i, line in enumerate(lines):
                  if "loadUrl" in line:
                      inject_idx = i
                      break
              
              if inject_idx != -1:
                  lines.insert(inject_idx, code)
                  with open(kotlin_path, 'w', encoding='utf-8') as f:
                      f.writelines(lines)
                  print("Injected Advanced Download Listener")
              else:
                  print("Could not find loadUrl anchor")
          except Exception as e:
              print(f"Error injecting kotlin: {e}")
          EOF
                 python3 inject_download.py
             fi
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $GITHUB_WORKSPACE/release-key.jks

      - name: Build Signed AAB and APK
        run: |
          ./gradlew bundleRelease assembleDebug \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME || 'App' }}-v${{ env.VERSION_NAME || '1.0' }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/mapping/release/mapping.txt
