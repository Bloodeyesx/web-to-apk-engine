name: Automated Release Factory
on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Repair Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: DYNAMIC INJECTION (The Secret Sauce)
        env:
          # Load payload into environment variables for safe handling
          APP_NAME: ${{ github.event.client_payload.general.name }}
          PACKAGE_ID: ${{ github.event.client_payload.general.package_id }}
          URL: ${{ github.event.client_payload.general.url }}
          VERSION_CODE: ${{ github.event.client_payload.general.version_code }}
          VERSION_NAME: ${{ github.event.client_payload.general.version_name }}
          THEME_COLOR: ${{ github.event.client_payload.design.theme_color }}
          GEN_MAPPING: ${{ github.event.client_payload.settings.generate_retrace_mapping }}
          ALLOW_DOWNLOADS: ${{ github.event.client_payload.settings.allow_downloads }}
        run: |
          # Apply defaults if empty
          if [ -z "$APP_NAME" ]; then APP_NAME="WebApp"; fi
          if [ -z "$PACKAGE_ID" ]; then PACKAGE_ID="com.example.webapp"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE=1; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
          
          echo "Configuration:"
          echo "Name: $APP_NAME"
          echo "Package: $PACKAGE_ID"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

          # 1. Update App Name
          # Use | as delimiter to avoid issues with slashes in URLs/Names
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml
          
          # 2. Find and Sync MainActivity.kt
          KOTLIN_PATH=$(find app/src/main/java -name "MainActivity.kt")
          sed -i "s|package .*|package $PACKAGE_ID|g" $KOTLIN_PATH
          sed -i "s|PLACEHOLDER_URL|$URL|g" $KOTLIN_PATH

          # 3. Update build.gradle.kts
          sed -i "s|namespace = \".*\"|namespace = \"$PACKAGE_ID\"|g" app/build.gradle.kts
          sed -i "s|applicationId = \".*\"|applicationId = \"$PACKAGE_ID\"|g" app/build.gradle.kts
          sed -i "s|versionCode = .*|versionCode = $VERSION_CODE|g" app/build.gradle.kts
          sed -i "s|versionName = \".*\"|versionName = \"$VERSION_NAME\"|g" app/build.gradle.kts
          sed -i "s|compileSdk = .*|compileSdk = 35|g" app/build.gradle.kts
          sed -i "s|targetSdk = .*|targetSdk = 35|g" app/build.gradle.kts

          # 4. Inject Theme Color (Best Effort)
          if [ ! -z "$THEME_COLOR" ]; then
             echo "Injecting Theme Color: $THEME_COLOR"
             sed -i "s|<color name=\"colorPrimary\">.*</color>|<color name=\"colorPrimary\">$THEME_COLOR</color>|g" app/src/main/res/values/colors.xml || true
             sed -i "s|<color name=\"colorPrimaryDark\">.*</color>|<color name=\"colorPrimaryDark\">$THEME_COLOR</color>|g" app/src/main/res/values/colors.xml || true
          fi

          # 5. Handle ReTrace Mapping (Minification)
          if [ "$GEN_MAPPING" == "true" ]; then
             echo "Enabling R8 Minification and Resource Shrinking..."
             sed -i "s|isMinifyEnabled = false|isMinifyEnabled = true|g" app/build.gradle.kts
             sed -i "s|isShrinkResources = false|isShrinkResources = true|g" app/build.gradle.kts
          fi

          # 6. Inject Permissions for Downloads
          if [ "$ALLOW_DOWNLOADS" == "true" ]; then
             echo "Injecting Download Permissions..."
             MANIFEST=$(find app/src/main -name "AndroidManifest.xml")
             # Insert permission before application tag
             sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><application|g' $MANIFEST
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $GITHUB_WORKSPACE/release-key.jks

      - name: Build Signed AAB and APK
        run: |
          ./gradlew bundleRelease assembleDebug \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.general.name }}-v${{ github.event.client_payload.general.version_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/mapping/release/mapping.txt
